      - "tests/cuda_comparison/**"
      - "tests/numerical_contract_*.h"
      - ".github/workflows/cuda-compile.yml"
  pull_request:
    paths:
      - "xgboost/**"
      # Shared headers, stubs and build configuration still trigger CUDA checks.
      - "!xgboost/src/common/metal_histogram.mm"
      - "!xgboost/src/common/metal_histogram.metal"
      - "scripts/ci_cuda_build.sh"
      - "scripts/build_cuda_comparison.py"
