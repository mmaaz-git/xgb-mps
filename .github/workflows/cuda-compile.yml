      - "tests/cuda_math_contracts.cu"
      - "tests/ranking_rounding_io.h"
      - "tests/ranking_objective_io.h"
      - "tests/ranking_objective_report.h"
      - "tests/ranking_primitive_io.h"
      - "tests/ranking_metric_io.h"
