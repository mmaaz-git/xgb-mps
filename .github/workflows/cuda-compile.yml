      - "tests/cuda_comparison/**"
      - "tests/numerical_contract_*.h"
      - ".github/workflows/cuda-compile.yml"

permissions:
  contents: read

# Finish the active build; a newer revision replaces only the pending build.
# This preserves compiler evidence while allowing development pushes to continue.
concurrency:
  group: cuda-compile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # NVIDIA CUDA 13.4.2 devel Ubuntu 24.04, immutable multi-architecture manifest.
    container: nvidia/cuda@sha256:7005688f5eaa5a9aaa9e555f546107c4454446a543347fd48b0bdb63ea027ad2
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git cmake ninja-build g++ pkg-config python3 \
            libgrpc++-dev libprotobuf-dev protobuf-compiler protobuf-compiler-grpc \
            libnvcomp5-cuda-13=5.3.0.16-1 libnvcomp5-dev-cuda-13=5.3.0.16-1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Compiler/host checks do not consume the large recorded GPU corpora.
          sparse-checkout: |
            .github
            scripts
            tests
            xgboost
          sparse-checkout-cone-mode: true
      - name: Compile CUDA, NCCL, nvCOMP and federated paths
        run: |
          mkdir -p results
          bash scripts/ci_cuda_build.sh 2>&1 | tee results/cuda-compile-ci.log
      - name: Preserve compiler evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cuda-compile-evidence
          path: |
            results/cuda-compile-ci.log
            build-cuda-ci/CMakeCache.txt
            build-cuda-ci/CMakeFiles/CMakeConfigureLog.yaml
            results/cuda-comparison-build/build.json
            results/cuda-comparison-build/metric-registry-baseline.txt
            results/cuda-comparison-build/metric-registry-probe.txt
            results/cuda-comparison-build/metric-defined-dynamic-symbols.txt
            results/cuda-comparison-build/linear-registry-baseline.txt
            results/cuda-comparison-build/linear-registry-probe.txt
            results/cuda-comparison-build/linear-defined-dynamic-symbols.txt
            results/cuda-comparison-build/auc-registry-probe.txt
            results/cuda-comparison-build/auc-defined-dynamic-symbols.txt
            results/cuda-comparison-build/cmake/auc_probe.inc
            results/cuda-comparison-build/cmake/auc_probe.inc.json
            results/cuda-comparison-build/sampling-rng-alignment.txt
            results/cuda-comparison-build/cmake/compile_commands.json
            results/cuda-comparison-build/cmake/CMakeCache.txt
            results/cuda-comparison-build/cmake/nvcomp-runtime-path.txt
          if-no-files-found: ignore
